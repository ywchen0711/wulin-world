<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>武林積木：龍門江湖</title>
  <meta name="description" content="武林積木的開放世界：操控奕叡與奕碩，在積木搭成的龍門江湖裡學輕功、打黑風寨、收集四片天機鑰。">
  <meta name="theme-color" content="#141c34">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="loading"><div class="lt">武林積木<b>龍門江湖</b></div><div class="lb"><i id="loadbar"></i></div><p>積木堆疊中… Building the world…</p></div>
  <div id="hudL"><div id="who"></div><div id="hearts"></div><div id="qi"></div><div id="skills"></div></div>
  <div id="hudR"><div id="keys"></div><div id="pages"></div><div id="coins"></div><button id="lang">EN</button></div>
  <div id="goal"></div>
  <div id="place"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="prompt" hidden></div>
  <div id="dlg" hidden><b id="dlgWho"></b><p id="dlgText"></p><i id="dlgMore"></i></div>
  <div id="ch" hidden><b id="chT"></b><div id="chL"></div></div>
  <div id="fadeo"></div>
  <div id="mapw" hidden><canvas id="map"></canvas></div>
  <div id="ending" hidden></div>
  <div id="help"></div>
  <div id="stick" hidden><i id="knob"></i></div>
  <div id="tbtns"><button class="tb" id="tMap"></button><button class="tb" id="tSwap"></button><button class="tb" id="tUse"></button><button class="tb" id="tSp"></button><button class="tb" id="tAtk"></button><button class="tb big" id="tJump">▲</button></div>
  <script type="module" src="js/game.js?v=5"></script>
  <script src="/hub.js" defer data-pos="top-right"></script>
</body>
</html>
